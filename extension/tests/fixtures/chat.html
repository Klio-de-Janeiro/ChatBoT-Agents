<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Provider mock chat</title>
    <style>
      body {
        font: 16px Arial;
        margin: 24px;
      }
      article {
        padding: 16px;
        border: 1px solid #ddd;
        margin: 8px;
      }
      textarea {
        width: 500px;
        height: 80px;
      }
      button {
        margin: 5px;
        padding: 8px;
      }
      .markdown-prose {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <nav>
      <button aria-label="User menu" data-testid="user-menu">Signed-in account</button
      ><a href="/">New chat</a>
    </nav>
    <section id="mode-controls">
      <div class="ds-toggle-button" role="button" tabindex="0" aria-pressed="false">DeepThink</div>
      <div class="ds-toggle-button" role="button" tabindex="0" aria-pressed="false">Search</div>
      <button class="qwen-chat-v2-dropdown-menu-select-button">
        <span class="qwen-chat-v2-dropdown-menu-select-label">Fast</span>
      </button>
      <div
        id="tools-trigger"
        class="mode-select-open"
        role="button"
        tabindex="0"
        aria-label="Select mode"
      >
        Tools
      </div>
      <div id="active-tool"></div>
      <div id="mode-menu"></div>
    </section>
    <main id="messages"></main>
    <textarea id="chat-input" placeholder="Message DeepSeek"></textarea>
    <button id="send-message-button" aria-label="Send message" data-testid="send-button">
      Send
    </button>
    <script>
      const mode = localStorage.getItem('mock-mode') || 'stream';
      window.fixture = { mode, clicks: 0, started: 0, finished: 0 };
      window.modeFixture = {
        events: { think: 0, search: 0, reasoning: 0, tools: 0, close: 0 },
        order: [],
        inputEvents: 0,
        failure: localStorage.getItem('mock-mode-failure') || '',
      };
      document.querySelector('textarea').addEventListener('input', () => modeFixture.inputEvents++);
      for (const toggle of document.querySelectorAll('.ds-toggle-button')) {
        toggle.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;
          const name = toggle.textContent === 'DeepThink' ? 'think' : 'search';
          modeFixture.events[name]++;
          modeFixture.order.push(name);
          if (modeFixture.failure === 'ignore-' + name) return;
          toggle.setAttribute(
            'aria-pressed',
            String(toggle.getAttribute('aria-pressed') !== 'true'),
          );
        });
      }
      const reasoningLabel = document.querySelector('.qwen-chat-v2-dropdown-menu-select-label');
      const menuContainer = document.querySelector('#mode-menu');
      const display = { fast: 'Fast', thinking: 'Thinking', auto: 'Auto' };
      document.querySelector('.qwen-chat-v2-dropdown-menu-select-button').onclick = () => {
        menuContainer.innerHTML = '<div role="menu" aria-label="В раздумье"></div>';
        const menu = menuContainer.firstChild;
        for (const [state, text] of Object.entries(display)) {
          const option = document.createElement('button');
          option.setAttribute('role', 'menuitem');
          option.textContent = text;
          if (reasoningLabel.textContent === text)
            option.className = 'qwen-chat-v2-dropdown-menu-item-selected';
          option.onclick = () => {
            modeFixture.events.reasoning++;
            modeFixture.order.push('reasoning');
            if (modeFixture.failure !== 'ignore-reasoning') reasoningLabel.textContent = text;
            menuContainer.innerHTML = '';
            if (modeFixture.failure === 'reset-search')
              setTimeout(() => (document.querySelector('#active-tool').innerHTML = ''), 40);
          };
          menu.append(option);
        }
      };
      function activeTool(text) {
        const holder = document.querySelector('#active-tool');
        holder.innerHTML = '';
        const chip = document.createElement('div');
        chip.className = 'mode-select-current-mode';
        chip.setAttribute('aria-disabled', 'false');
        chip.textContent = text;
        const close = document.createElement('span');
        close.className = 'mode-select-current-mode-close';
        close.setAttribute('role', 'img');
        close.setAttribute('aria-label', 'Close');
        close.style.cssText = 'display:inline-block;width:16px;height:16px;background:#ccc';
        close.onclick = () => {
          modeFixture.events.close++;
          modeFixture.order.push('close');
          chip.remove();
        };
        chip.append(close);
        holder.append(chip);
      }
      window.setFixtureTool = activeTool;
      document.querySelector('#tools-trigger').onclick = () => {
        modeFixture.events.tools++;
        menuContainer.innerHTML =
          '<div role="menu"><button role="menuitem"><span class="mode-select-dropdown-item-name">Web search</span></button></div>';
        menuContainer.querySelector('[role=menuitem]').onclick = () => {
          modeFixture.events.search++;
          modeFixture.order.push('search');
          if (modeFixture.failure !== 'ignore-search') activeTool('Web search');
          reasoningLabel.textContent = 'Fast';
          menuContainer.innerHTML = '';
        };
      };
      const messages = document.querySelector('#messages');
      const composer = document.querySelector('textarea');
      const send = document.querySelector('#send-message-button');
      function message(role, text) {
        const article = document.createElement('article');
        article.className = role + '-message';
        article.dataset.messageRole = role;
        const body = document.createElement('div');
        body.dataset.messageContent = '';
        body.className = 'markdown-prose ds-markdown';
        body.textContent = text;
        article.append(body);
        messages.append(article);
        return article;
      }
      function completed(article) {
        const copy = document.createElement('button');
        copy.setAttribute('aria-label', 'Copy');
        copy.textContent = 'Copy';
        article.append(copy);
      }
      if (location.pathname !== '/') {
        message('user', 'Earlier user prompt');
        completed(message('assistant', 'Earlier answer must never be returned'));
      }
      if (mode === 'draft') composer.value = 'User unsent draft';
      if (mode === 'login') {
        document.querySelector('nav').innerHTML = '<input type="password" placeholder="Sign in">';
      }
      if (mode === 'captcha-before') {
        const c = document.createElement('div');
        c.className = 'captcha';
        c.textContent = 'Verify human';
        document.body.append(c);
      }
      send.onclick = () => {
        window.fixture.clicks++;
        window.fixture.started = Date.now();
        window.fixture.sentModes = {
          think: document.querySelector('.ds-toggle-button').getAttribute('aria-pressed'),
          reasoning: reasoningLabel.textContent,
          tool: document.querySelector('.mode-select-current-mode')?.textContent,
        };
        const prompt = composer.value;
        composer.value = '';
        send.disabled = true;
        message('user', mode === 'wrong-user' ? 'Someone else prompt' : prompt);
        if (mode === 'captcha') {
          const c = document.createElement('div');
          c.className = 'captcha';
          c.textContent = 'Verify human';
          messages.append(c);
          return;
        }
        if (mode === 'quota') {
          const c = document.createElement('div');
          c.dataset.testid = 'quota-error';
          c.textContent = 'Rate limit exceeded';
          messages.append(c);
          return;
        }
        if (mode === 'no-answer') return;
        const stop = document.createElement('button');
        stop.setAttribute('aria-label', 'Stop generating');
        stop.textContent = 'Stop';
        document.body.append(stop);
        const assistant = message('assistant', 'Partial');
        setTimeout(() => {
          assistant.firstElementChild.textContent = 'Partial with more tokens';
        }, 100);
        if (mode === 'paused') return;
        setTimeout(() => {
          if (mode === 'extra-turn') message('user', 'A user interfered');
          if (mode === 'replace-answer') {
            assistant.remove();
            completed(message('assistant', 'Replaced response'));
            stop.remove();
            send.disabled = false;
            return;
          }
          // Rich provider-like answer: heading, emphasis, math, table, code.
          assistant.firstElementChild.innerHTML =
            '<h3>Answer for <em>' +
            prompt.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
            '</em></h3>' +
            '<p>Energy: <span class="katex"><span class="katex-mathml">' +
            '<math><annotation encoding="application/x-tex">E = mc^2</annotation></math>' +
            '</span><span class="katex-html">E=mc²</span></span> keeps working.</p>' +
            '<table><thead><tr><th>a</th><th>b</th></tr></thead>' +
            '<tbody><tr><td>1</td><td>2</td></tr></tbody></table>' +
            '<pre class="language-python"><code class="language-python">print(42)</code></pre>';
          completed(assistant);
          stop.remove();
          send.disabled = false;
          history.replaceState(null, '', '/c/mock-' + Date.now());
          window.fixture.finished = Date.now();
        }, 650);
      };
    </script>
  </body>
</html>
